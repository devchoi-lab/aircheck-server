name: Test

# 단위 테스트 / 통합 테스트
# - PR(main 대상)에서 실행
# - 배포 워크플로우(deploy-dev.yml, deploy.yml)에서 workflow_call로 재사용
on:
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 단위 테스트 (Docker 불필요)
      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 통합 테스트 (Testcontainers MariaDB 사용 - ubuntu-latest의 Docker 이용)
      - name: Run integration tests
        run: ./gradlew :app:integrationTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/'
