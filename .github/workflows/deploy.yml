name: Deploy to Lightsail

# master 브랜치에 푸시될 때 실행 (prod 배포)
on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  # 테스트 통과 후에만 이미지 빌드/배포 진행
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    uses: ./.github/workflows/deploy-common.yml
    with:
      environment: prod
      image_tag: latest
      compose_file: docker-compose.prod.yml
      appcheck_enabled: true
    secrets: inherit
