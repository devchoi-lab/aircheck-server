server:
  port: 8080

spring:
  application:
    name: aircheck-server
    
  # Database
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aircheck}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
        
  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

# 날씨 API 설정
# weather.provider 값에 따라 WeatherPort 구현체가 결정됨 (스프링 빈 조건부 활성화).
# - kma      : KmaAdapter 활성화. 기상청 공공데이터포털 API 사용 (AIRKOREA_API_KEY 필요).
# - openmeteo: OpenMeteoAdapter 활성화. 무료 Open-Meteo API 사용 (키 불필요).
# - 그 외 값 또는 환경변수 미설정: OpenMeteoAdapter가 폴백으로 활성화됨 (matchIfMissing = true).
weather:
  provider: ${WEATHER_PROVIDER:kma}

# 에어코리아 API
airkorea:
  api-key: ${AIRKOREA_API_KEY:your-api-key-here}
  base-url: https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
  station-url: https://apis.data.go.kr/B552584/MsrstnInfoInqireSvc

# 기상청 API (공공데이터포털 - 에어코리아와 동일 키)
kma:
  api:
    key: ${AIRKOREA_API_KEY:}
    base-url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
    mid-url: http://apis.data.go.kr/1360000/MidFcstInfoService

# Firebase
firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  key-path: ${FIREBASE_KEY_PATH:/opt/aircheck/firebase-key.json}
  project-id: ${FIREBASE_PROJECT_ID:}
  project-number: ${FIREBASE_PROJECT_NUMBER:}

# App Check
appcheck:
  enabled: ${APPCHECK_ENABLED:false}

# Admin API
admin:
  api-key: ${ADMIN_API_KEY:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.seriouschoi.aircheck: DEBUG
    org.hibernate.SQL: DEBUG

# Swagger UI (#15)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
